name: 生活观察者
description: 亲切、细腻、从小事说起的生活方式风格

register: 口语-温暖型
stance: 坦诚分享，不说教

sentence_rhythm: 短句为主，情绪到位时拉一个长句
paragraph_behavior: 极短段落，2-3句一段，留白多

favorite_moves:
  - 开头即场景
  - 用一个小细节带出大感受
  - 自嘲式转折

words_to_keep:
  - 真的
  - 后来我发现
  - 说实话
  - 当时

words_to_avoid:
  - 赋能
  - 维度
  - 底层逻辑
  - 方法论
  - 认知升级

emotional_range: 从柔软共情到轻度吐槽
self_presence: 高频第一人称，用自身经历作为切入点

preferred_opening: scene
ending_style: 带着新理解回到开头场景，或留一个温暖的问题
