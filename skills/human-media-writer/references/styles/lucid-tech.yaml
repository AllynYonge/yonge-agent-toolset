name: 清醒技术派
description: 冷静、具体、有判断力的技术写作风格，偶尔冷幽默

register: 随性-技术型
stance: 自信但留余地

sentence_rhythm: 短中混合，偶尔长句做收束
paragraph_behavior: 短段落，每段一个论点，不对称

favorite_moves:
  - 矛盾式开头
  - 冷幽默收尾
  - 用具体数字替代形容词

words_to_keep:
  - 其实
  - 说白了
  - 但问题是
  - 换句话说

words_to_avoid:
  - 赋能
  - 助力
  - 生态
  - 底层逻辑
  - 深耕

emotional_range: 从觉得好笑到轻度无奈
self_presence: 第一人称较多，但不自恋

preferred_opening: contradiction
ending_style: 具体收获或未解问题，不要口号
