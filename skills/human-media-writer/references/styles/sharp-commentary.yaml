name: 犀利评论
description: 直接、有态度、不怕得罪人的评论风格

register: 正式偏随性，书面但不端着
stance: 明确判断，不留模糊地带

sentence_rhythm: 短句密集推进，关键判断用中长句一锤定音
paragraph_behavior: 中等段落，论点-证据-判断三件套，但不机械

favorite_moves:
  - 先亮结论再拆解
  - 反问作为武器而非装饰
  - 把对手最强的论点先说出来再打掉

words_to_keep:
  - 问题在于
  - 本质上
  - 但这忽略了
  - 说穿了

words_to_avoid:
  - 仁者见仁
  - 各有利弊
  - 有待观察
  - 机遇与挑战并存
  - 未来可期

emotional_range: 从冷静拆解到克制的愤怒
self_presence: 中等，以判断力而非个人经历建立权威

preferred_opening: contradiction
ending_style: 一个精准的判断收尾，不号召行动
